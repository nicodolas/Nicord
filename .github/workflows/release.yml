name: Release

# Releases are cut from TAGS on main: pushing a tag `vX.Y.Z` builds
# and publishes that version. There is no release branch — MAIN ONLY
# (see docs/ARCHITECTURE.md). To cut a release:
#   1. Bump `version` in Cargo.toml to X.Y.Z and commit on main.
#      (The in-app updater compares the release tag against
#      CARGO_PKG_VERSION, so the tag must be NEWER than the version
#      in the binary users already run.)
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# The tag name IS the version; no version is computed in CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Generate icon.ico from base64 PNG
        shell: pwsh
        run: |
          # Decode the base64 text file shipped in the repo (the GitHub write
          # route used for this repo cannot carry binary files, so the icon
          # is generated here in CI instead of being committed as .ico).
          $b64 = (Get-Content assets/icon-256.b64 -Raw) -replace '\s', ''
          [IO.File]::WriteAllBytes('icon-256.png', [Convert]::FromBase64String($b64))
          # ImageMagick via Chocolatey (preinstalled on windows-latest).
          # refreshenv picks up the new PATH in this session; fall back to
          # the install folder if magick is still not on PATH.
          choco install imagemagick -y
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv
          $magick = (Get-Command magick -ErrorAction SilentlyContinue).Source
          if (-not $magick) {
            $magick = Get-ChildItem 'C:\Program Files\ImageMagick-*\magick.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $magick) { throw 'ImageMagick not found after install' }
          & $magick icon-256.png -define icon:auto-resize=256,128,64,48,32,16 icon.ico
          if (-not (Test-Path icon.ico)) { throw 'icon.ico was not created' }
      - name: Assemble zip + checksums
        shell: pwsh
        run: |
          # The zip name must match `expected_asset_name` in
          # src/updater.rs exactly, or the in-app updater will not
          # find this release.
          $zip = "Nicord-$env:GITHUB_REF_NAME-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Cargo builds target\release\nicord.exe; ship it as Nicord.exe.
          Copy-Item target\release\nicord.exe dist\Nicord.exe
          Copy-Item packaging\README.txt dist\README.txt
          Copy-Item LICENSE dist\LICENSE
          Copy-Item icon.ico dist\icon.ico
          Compress-Archive -Path dist\* -DestinationPath $zip
          # SHA256SUMS.txt: the in-app updater verifies the zip
          # against this file before extracting it. Format is the
          # conventional "<hash>  <filename>" (two spaces).
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii SHA256SUMS.txt
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nicord ${{ github.ref_name }}
          body: |
            Nicord ${{ github.ref_name }} — bản phát hành cho Windows.

            Tải file zip bên dưới, giải nén ra bất cứ đâu rồi chạy Nicord.exe. Không cần cài đặt.

            Chế độ Webhook (chính thức, khuyên dùng) gửi tin qua webhook của Discord. Chế độ tài khoản gửi bằng chính tài khoản Discord của bạn, việc này có thể khiến tài khoản bị khóa, nên hãy dùng tài khoản phụ. Xem file README.txt trong gói zip để biết cách dùng.

            SHA256SUMS.txt kèm theo chứa mã băm SHA-256 của file zip; ứng dụng tự kiểm tra mã băm khi cập nhật trong app.
          files: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt
