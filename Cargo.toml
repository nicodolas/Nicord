[package]
name = "nicord"
version = "0.1.0"
edition = "2021"
description = "Nicord — desktop Discord auto-sender using your own account. Local-first, no login, license-key unlocked."
license = "MIT"
authors = ["Nico <nicodolas>"]
repository = "https://github.com/nicodolas/Nicord"

[dependencies]
# UI — native immediate-mode, no React / Electron / WebView.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
# Async + HTTP (Discord REST only; no gateway needed for scheduled sending)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
# Crypto: AES-256-GCM token encryption + Ed25519 license verification
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
# Time / ids / logging
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
rand_core = "0.6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "6"

[dev-dependencies]
rand_chacha = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
