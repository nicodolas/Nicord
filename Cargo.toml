[package]
name = "nicord"
version = "0.1.0"
edition = "2021"
description = "Nicord — desktop Discord auto-sender using your own account. Local-first, no login."
license = "MIT"
authors = ["Nico <nicodolas>"]
repository = "https://github.com/nicodolas/Nicord"

[dependencies]
# UI — native immediate-mode, no React / Electron / WebView.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
# Async + HTTP (Discord REST only; no gateway needed for scheduled sending)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Auto-update: extract the release zip (Deflate, as produced by
# Compress-Archive in the release workflow). Pure Rust, no system deps.
zip = "2"
# Minimal gateway client (slash commands only): wss with rustls, same
# TLS stack as reqwest — no OpenSSL/native-tls system deps on Windows.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
# Crypto: AES-256-GCM token encryption
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
# Time / ids / logging
chrono = { version = "0.4", features = ["clock", "serde"] }
# App window icon (PNG decode only; embedded as base64 text via include_str! in main.rs)
image = { version = "0.25", default-features = false, features = ["png"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dirs = "6"
keyring = "4.2.0"

# Windows-only: system tray + autostart (the release target is Windows;
# Linux builds are check-only and never compile these).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
winreg = "0.55"

[dev-dependencies]
rand_chacha = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
